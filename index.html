<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Auth & Link Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        }

        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            color: #ffffff;
        }

        /* 画面中央に青白くネオン発光する強烈なログインボタン */
        .discord-neon-btn {
            background: linear-gradient(135deg, #5865F2 0%, #7983F5 40%, #D0DBFF 100%);
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.95), 0 0 24px rgba(88, 101, 242, 1);
            box-shadow: 
                0 0 25px rgba(88, 101, 242, 0.9),
                0 0 55px rgba(135, 160, 255, 0.85),
                0 0 95px rgba(255, 255, 255, 0.7),
                inset 0 0 20px rgba(255, 255, 255, 0.85);
            animation: intenseNeonPulse 2.5s infinite alternate ease-in-out;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
        }

        .discord-neon-btn:active, .discord-neon-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 
                0 0 35px rgba(88, 101, 242, 1),
                0 0 75px rgba(150, 180, 255, 1),
                0 0 130px rgba(255, 255, 255, 1),
                inset 0 0 30px rgba(255, 255, 255, 1);
            filter: brightness(1.2);
        }

        @keyframes intenseNeonPulse {
            0% {
                box-shadow: 
                    0 0 20px rgba(88, 101, 242, 0.85),
                    0 0 45px rgba(120, 140, 255, 0.6),
                    0 0 75px rgba(255, 255, 255, 0.5),
                    inset 0 0 15px rgba(255, 255, 255, 0.7);
            }
            100% {
                box-shadow: 
                    0 0 45px rgba(88, 101, 242, 1),
                    0 0 85px rgba(160, 185, 255, 0.9),
                    0 0 125px rgba(255, 255, 255, 0.85),
                    inset 0 0 28px rgba(255, 255, 255, 0.95);
            }
        }

        /* Glassmorphism Card Style */
        .glass-panel {
            background: rgba(13, 14, 22, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* テキスト省略 (ellipsis) */
        .ellipsis-text {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* スムーススクロールハイライト */
        .highlight-card {
            animation: cardGlow 2s ease-in-out;
        }

        @keyframes cardGlow {
            0% { border-color: #3B82F6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.8); }
            100% { border-color: rgba(255, 255, 255, 0.1); box-shadow: none; }
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- 画面右上：ログイン済みユーザーヘッダー (アバター & ドロップダウン) -->
    <header id="user-header" class="hidden fixed top-3 right-3 z-50">
        <div class="relative">
            <button onclick="toggleUserMenu()" class="flex items-center space-x-2 p-1 bg-gray-900/90 border border-gray-700/80 rounded-full transition cursor-pointer shadow-lg active:scale-95">
                <img id="nav-user-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full border border-[#5865F2] object-cover">
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 pr-1.5"></i>
            </button>

            <!-- ドロップダウンメニュー -->
            <div id="user-menu-dropdown" class="hidden absolute right-0 mt-2 w-52 bg-[#0f1017] border border-gray-800 rounded-2xl shadow-2xl overflow-hidden py-2 z-50">
                <div class="px-4 py-2.5 border-b border-gray-800/80">
                    <p id="menu-user-name" class="text-xs font-bold text-white truncate"></p>
                    <p id="menu-user-id" class="text-[9px] text-gray-400 font-mono truncate"></p>
                </div>
                
                <div class="py-1">
                    <button onclick="switchView('account-settings')" class="w-full text-left px-4 py-2 text-xs text-gray-200 active:bg-indigo-600/30 flex items-center space-x-3 transition">
                        <i class="fa-solid fa-gear text-indigo-400 w-4"></i>
                        <span class="font-bold">アカウント設定</span>
                    </button>
                    <button onclick="switchView('saved-links')" class="w-full text-left px-4 py-2 text-xs text-gray-200 active:bg-amber-600/30 flex items-center space-x-3 transition">
                        <i class="fa-solid fa-bookmark text-amber-400 w-4"></i>
                        <span class="font-bold">保存したリンク</span>
                    </button>
                    <button onclick="switchView('all-links')" class="w-full text-left px-4 py-2 text-xs text-gray-200 active:bg-emerald-600/30 flex items-center space-x-3 transition">
                        <i class="fa-solid fa-list-check text-emerald-400 w-4"></i>
                        <span class="font-bold">All Link 一覧</span>
                    </button>
                </div>

                <div class="border-t border-gray-800/80 pt-1 mt-1">
                    <button onclick="logout()" class="w-full text-left px-4 py-2 text-xs text-red-500 active:bg-red-950/40 font-bold flex items-center space-x-3 transition">
                        <i class="fa-solid fa-right-from-bracket w-4"></i>
                        <span>ログアウト</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツコンテナ -->
    <main class="flex-grow flex items-center justify-center p-3 relative z-10 w-full max-w-2xl mx-auto">

        <!-- 1. ログイン前：画面中央の青白くネオン発光するログインボタンのみ -->
        <section id="login-view" class="flex flex-col items-center justify-center my-auto py-20">
            <button onclick="loginWithDiscord()" class="discord-neon-btn px-8 py-4 sm:px-12 sm:py-5 rounded-2xl text-lg sm:text-2xl font-black flex items-center justify-center space-x-3 tracking-wider select-none cursor-pointer active:scale-95">
                <i class="fa-brands fa-discord text-2xl sm:text-3xl drop-shadow-[0_0_10px_rgba(255,255,255,1)]"></i>
                <span>Discordでログイン</span>
            </button>
        </section>

        <!-- 2. 認証ステータス & ロール判定 画面 -->
        <section id="auth-status-view" class="hidden w-full max-w-md my-auto">
            <div class="glass-panel rounded-3xl p-6 text-center shadow-[0_0_50px_rgba(88,101,242,0.15)] relative">
                <!-- ローダー -->
                <div id="checking-loader" class="py-10">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-[#5865F2] mb-3"></i>
                    <p class="text-xs font-semibold text-gray-300">サーバー権限を確認中...</p>
                </div>

                <!-- エラー表示領域 -->
                <div id="error-message-box" class="hidden p-3 mb-4 bg-red-900/50 border border-red-500/80 rounded-xl text-red-200 text-xs text-left">
                    <p class="font-bold flex items-center"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>エラーが発生しました</p>
                    <p id="error-message-text" class="mt-1 text-[11px] font-mono break-all"></p>
                </div>

                <!-- ステータスコンテンツ -->
                <div id="status-content" class="hidden">
                    <img id="user-avatar" class="w-16 h-16 rounded-full mx-auto mb-2 border-2 border-[#5865F2] shadow-[0_0_15px_rgba(88,101,242,0.5)]" src="" alt="Avatar">
                    <h1 id="user-name" class="text-lg font-extrabold text-white"></h1>
                    <p id="user-id" class="text-[10px] text-indigo-300/70 font-mono mt-0.5 mb-4"></p>

                    <!-- ロールなし (赤文字 & 権限購入案内) -->
                    <div id="no-role-view" class="hidden space-y-3 my-4 p-4 bg-red-950/40 border border-red-500/50 rounded-2xl">
                        <p class="text-red-500 font-black text-base sm:text-lg tracking-wide">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i>Link Memberロールがありません
                        </p>
                        <div class="text-xs text-gray-300 space-y-1">
                            <a href="https://discord.gg/9hZdjpQAw" target="_blank" class="text-red-400 hover:text-red-300 underline font-bold break-all block py-1">
                                https://discord.gg/9hZdjpQAw
                            </a>
                            <p>権限を購入してください</p>
                        </div>
                    </div>

                    <!-- ロールあり (緑文字 & All Link ボタン) -->
                    <div id="has-role-view" class="hidden space-y-4 my-4">
                        <div class="inline-flex items-center space-x-1.5 px-3 py-1 bg-emerald-950/60 border border-emerald-500/60 rounded-full text-emerald-400 font-extrabold text-sm tracking-wider">
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>Link Member</span>
                        </div>

                        <div>
                            <button onclick="switchView('all-links')" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-gray-950 font-black text-base tracking-wider cursor-pointer shadow-[0_0_20px_rgba(16,185,129,0.4)] active:scale-95 transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-list-check text-lg"></i>
                                <span>All Link</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. アカウント設定 画面 -->
        <section id="account-settings-view" class="hidden w-full my-4">
            <div class="glass-panel rounded-3xl p-5 border border-indigo-500/30">
                <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                            <i class="fa-solid fa-user-gear text-sm"></i>
                        </div>
                        <h2 class="text-base font-black text-white">アカウント設定</h2>
                    </div>
                    <button onclick="switchView('all-links')" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-[11px] text-gray-300 rounded-lg transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i>戻る
                    </button>
                </div>

                <div class="space-y-4">
                    <!-- アバターと基本情報 -->
                    <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-4 text-center flex flex-col items-center justify-center">
                        <img id="acc-avatar" class="w-16 h-16 rounded-full border-2 border-indigo-500 mb-2 shadow-[0_0_15px_rgba(99,102,241,0.3)]" src="" alt="Avatar">
                        <h3 id="acc-username" class="text-base font-bold text-white"></h3>
                        <p id="acc-id" class="text-[10px] text-indigo-300 font-mono mt-0.5"></p>
                    </div>

                    <!-- 所持ロール一覧 -->
                    <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-4">
                        <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center">
                            <i class="fa-solid fa-id-badge text-indigo-400 mr-1.5"></i>所持しているロール
                        </h4>
                        <div id="acc-roles-container" class="flex flex-wrap gap-1.5">
                            <!-- JSで動的描画 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. 保存したリンク一覧 画面 -->
        <section id="saved-links-view" class="hidden w-full my-4">
            <div class="glass-panel rounded-3xl p-5 border border-amber-500/30">
                <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                            <i class="fa-solid fa-bookmark text-sm"></i>
                        </div>
                        <div>
                            <h2 class="text-base font-black text-white">保存したリンク</h2>
                        </div>
                    </div>
                    <button onclick="switchView('all-links')" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-[11px] text-gray-300 rounded-lg transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i>戻る
                    </button>
                </div>

                <div id="saved-links-container" class="space-y-3">
                    <!-- Dynamic Saved Links Here -->
                </div>
            </div>
        </section>

        <!-- 5. All Link (メインリンク集一覧) 画面 -->
        <section id="all-links-view" class="hidden w-full my-4">
            <div class="glass-panel rounded-3xl p-4 sm:p-6 border border-emerald-500/30">
                <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                            <i class="fa-solid fa-link text-sm"></i>
                        </div>
                        <div>
                            <h2 class="text-base font-black text-white">All Link ポータル</h2>
                        </div>
                    </div>
                </div>

                <!-- リンクカードコンテナ -->
                <div id="all-links-container" class="space-y-3">
                    <!-- Dynamic Render All Links -->
                </div>
            </div>
        </section>

    </main>

    <script>
        // 設定定数
        const CLIENT_ID = '1549006862576390195';
        const TARGET_SERVER_ID = '1545048902032556173';
        const REQUIRED_ROLE_ID = '1549026062015529031';
        
        // redirect_uri は現在のページURLの末尾のパラメータを除いたクリーンな原点URL
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        /**
         * ★ JavaScript内で追加・変更できるリンクデータ一覧
         */
        const LINK_LIST = [
            {
                id: 1,
                title: '公式 Discord コミュニティ',
                url: 'https://discord.gg/9hZdjpQAw',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                description: 'Link Member 限定コミュニティサーバーです。メンバー同士の交流を行っています。'
            },
            {
                id: 2,
                title: 'VIP 会員専用 ポータルサイト',
                url: 'https://example.com/vip-portal',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
                description: '限定ロールを保有しているメンバーのみがアクセス可能な専用ダウンロードポータル。'
            },
            {
                id: 3,
                title: 'お問い合わせ & サポート',
                url: 'https://example.com/support',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4',
                description: '権限に関する質問やエラーのトラブルシューティングを受け付けている窓口です。'
            }
        ];

        // 状態管理
        let currentUser = null;
        let userRoles = [];
        let savedLinkIds = JSON.parse(localStorage.getItem('saved_link_ids') || '[]');

        function switchView(viewName) {
            const views = ['login', 'auth-status', 'account-settings', 'saved-links', 'all-links'];
            views.forEach(v => {
                const el = document.getElementById(`${v}-view`);
                if (el) {
                    if (v === viewName) {
                        el.classList.remove('hidden');
                    } else {
                        el.classList.add('hidden');
                    }
                }
            });

            const dropdown = document.getElementById('user-menu-dropdown');
            if (dropdown) dropdown.classList.add('hidden');

            if (viewName === 'all-links') renderAllLinks();
            if (viewName === 'saved-links') renderSavedLinks();
        }

        function updateUserInfoUI(user) {
            const avatarUrl = user.avatar 
                ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                : `https://cdn.discordapp.com/embed/avatars/0.png`;

            document.getElementById('nav-user-avatar').src = avatarUrl;
            document.getElementById('menu-user-name').textContent = user.username;
            document.getElementById('menu-user-id').textContent = `ID: ${user.id}`;

            document.getElementById('user-avatar').src = avatarUrl;
            document.getElementById('user-name').textContent = user.username;
            document.getElementById('user-id').textContent = `ID: ${user.id}`;

            document.getElementById('acc-avatar').src = avatarUrl;
            document.getElementById('acc-username').textContent = user.username;
            document.getElementById('acc-id').textContent = `ID: ${user.id}`;
        }

        function updateRolesUI(roles) {
            const container = document.getElementById('acc-roles-container');
            if (!container) return;
            container.innerHTML = '';

            if (!roles || roles.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-500">所有ロールはありません</span>`;
                return;
            }

            roles.forEach(roleId => {
                const badge = document.createElement('span');
                if (roleId === REQUIRED_ROLE_ID) {
                    badge.className = 'px-2 py-0.5 bg-emerald-500/20 border border-emerald-500/40 rounded text-emerald-300 font-bold text-[10px]';
                    badge.textContent = `★ Link Member (${roleId})`;
                } else {
                    badge.className = 'px-2 py-0.5 bg-indigo-500/20 border border-indigo-500/40 rounded text-indigo-300 font-mono text-[10px]';
                    badge.textContent = `ID: ${roleId}`;
                }
                container.appendChild(badge);
            });
        }

        function toggleUserMenu() {
            const dropdown = document.getElementById('user-menu-dropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        }

        function loginWithDiscord() {
            // Implicit Grant Flow (token) を使用して単一HTMLのみで動作させる
            const scope = encodeURIComponent('identify guilds guilds.members.read');
            const redirect = encodeURIComponent(REDIRECT_URI);
            const authUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${redirect}&scope=${scope}`;
            window.location.href = authUrl;
        }

        async function handleOAuthCallback() {
            let accessToken = null;
            
            // 1. URLのハッシュ (#access_token=...) またはクエリからトークンを探す
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);

            if (params.has('access_token')) {
                accessToken = params.get('access_token');
                sessionStorage.setItem('discord_access_token', accessToken);
                // アドレスバーのハッシュを消去して綺麗なURLに
                history.replaceState(null, null, window.location.pathname);
            } else {
                accessToken = sessionStorage.getItem('discord_access_token');
            }

            if (accessToken) {
                switchView('auth-status');

                try {
                    // ユーザー情報取得
                    const userRes = await fetch('https://discord.com/api/v10/users/@me', {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    
                    if (!userRes.ok) {
                        sessionStorage.removeItem('discord_access_token');
                        throw new Error('認証トークンの期限が切れました。再ログインしてください。');
                    }
                    
                    currentUser = await userRes.json();
                    updateUserInfoUI(currentUser);

                    // サーバーメンバー情報（ロール一覧）の取得
                    let hasRole = false;
                    try {
                        const memberRes = await fetch(`https://discord.com/api/v10/users/@me/guilds/${TARGET_SERVER_ID}/member`, {
                            headers: { Authorization: `Bearer ${accessToken}` }
                        });
                        
                        if (memberRes.ok) {
                            const memberData = await memberRes.json();
                            userRoles = memberData.roles || [];
                            updateRolesUI(userRoles);
                            if (userRoles.includes(REQUIRED_ROLE_ID)) {
                                hasRole = true;
                            }
                        }
                    } catch (err) {
                        console.error('ロール取得失敗:', err);
                    }

                    document.getElementById('checking-loader').classList.add('hidden');
                    document.getElementById('status-content').classList.remove('hidden');

                    if (hasRole) {
                        document.getElementById('has-role-view').classList.remove('hidden');
                        document.getElementById('user-header').classList.remove('hidden');
                        // ロールがある場合は最初から全リンク画面を表示
                        switchView('all-links');
                    } else {
                        document.getElementById('no-role-view').classList.remove('hidden');
                        document.getElementById('user-header').classList.remove('hidden');
                    }

                } catch (error) {
                    console.error('認証エラー:', error);
                    showError(error.message);
                    sessionStorage.removeItem('discord_access_token');
                }
            } else {
                switchView('login');
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('error-message-box');
            const errText = document.getElementById('error-message-text');
            if (errBox && errText) {
                errText.textContent = msg;
                errBox.classList.remove('hidden');
            }
        }

        function renderAllLinks() {
            const container = document.getElementById('all-links-container');
            if (!container) return;
            container.innerHTML = '';

            LINK_LIST.forEach(link => {
                const isSaved = savedLinkIds.includes(link.id);
                const card = document.createElement('div');
                card.id = `link-card-${link.id}`;
                card.className = 'p-3 bg-gray-900/90 border border-gray-800 rounded-xl relative flex items-center space-x-3 group';

                card.innerHTML = `
                    <div class="relative w-16 h-24 rounded-lg overflow-hidden bg-black shrink-0 border border-gray-800 flex items-center justify-center">
                        <video src="${link.videoUrl}#t=0.001" preload="metadata" muted playsinline class="w-full h-full object-contain bg-black pointer-events-none"></video>
                        <div class="absolute bottom-1 left-1 right-1 flex justify-center pointer-events-none">
                            <span class="text-[8px] text-gray-300 font-mono bg-black/80 px-1 rounded">0:00</span>
                        </div>
                    </div>

                    <div class="flex-1 min-w-0 pr-6">
                        <h3 class="text-white font-bold text-xs truncate">${link.title}</h3>
                        <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-2 leading-tight">${link.description}</p>

                        <div class="mt-1.5">
                            <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="text-[10px] text-emerald-400 hover:text-emerald-300 underline break-all inline-flex items-center space-x-1 font-mono">
                                <span class="truncate">${link.url}</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[8px] ml-1 shrink-0"></i>
                            </a>
                        </div>
                    </div>

                    <button onclick="toggleSaveLink(${link.id})" class="absolute top-2 right-2 text-sm p-1.5 active:scale-125 transition">
                        <i class="${isSaved ? 'fa-solid fa-bookmark text-amber-400' : 'fa-regular fa-bookmark text-gray-500'}"></i>
                    </button>
                `;

                container.appendChild(card);
            });
        }

        function renderSavedLinks() {
            const container = document.getElementById('saved-links-container');
            if (!container) return;
            container.innerHTML = '';

            const savedItems = LINK_LIST.filter(link => savedLinkIds.includes(link.id));

            if (savedItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fa-regular fa-bookmark text-2xl mb-1 block"></i>
                        <p class="text-xs">保存されているリンクはありません</p>
                    </div>
                `;
                return;
            }

            savedItems.forEach(link => {
                const card = document.createElement('div');
                card.className = 'p-2.5 bg-gray-900/90 border border-amber-500/20 rounded-xl flex items-center justify-between space-x-2';

                card.innerHTML = `
                    <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                        <div class="w-12 h-16 rounded-md overflow-hidden bg-black shrink-0 border border-gray-800 flex items-center justify-center">
                            <video src="${link.videoUrl}#t=0.001" preload="metadata" muted playsinline class="w-full h-full object-contain bg-black"></video>
                        </div>

                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-bold text-white truncate">${link.title}</h4>
                            <p class="text-[10px] text-gray-400 ellipsis-text mt-0.5 pr-1">${link.description}</p>
                        </div>
                    </div>

                    <button onclick="scrollToLinkInAllLinks(${link.id})" class="px-2.5 py-1.5 bg-amber-500/20 active:bg-amber-500/40 border border-amber-500/40 text-amber-300 font-bold text-[10px] rounded-lg transition shrink-0 flex items-center space-x-1">
                        <span>移動</span>
                        <i class="fa-solid fa-chevron-right text-[8px]"></i>
                    </button>
                `;

                container.appendChild(card);
            });
        }

        function toggleSaveLink(id) {
            if (savedLinkIds.includes(id)) {
                savedLinkIds = savedLinkIds.filter(savedId => savedId !== id);
            } else {
                savedLinkIds.push(id);
            }

            localStorage.setItem('saved_link_ids', JSON.stringify(savedLinkIds));
            renderAllLinks();
        }

        function scrollToLinkInAllLinks(id) {
            switchView('all-links');

            setTimeout(() => {
                const targetCard = document.getElementById(`link-card-${id}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetCard.classList.add('highlight-card');
                    setTimeout(() => targetCard.classList.remove('highlight-card'), 2000);
                }
            }, 150);
        }

        function logout() {
            sessionStorage.removeItem('discord_access_token');
            currentUser = null;
            userRoles = [];
            document.getElementById('user-header').classList.add('hidden');
            switchView('login');
        }

        window.addEventListener('click', (e) => {
            const header = document.getElementById('user-header');
            if (header && !header.contains(e.target)) {
                const dropdown = document.getElementById('user-menu-dropdown');
                if (dropdown) dropdown.classList.add('hidden');
            }
        });

        window.addEventListener('DOMContentLoaded', handleOAuthCallback);
    </script>
</body>
</html>
