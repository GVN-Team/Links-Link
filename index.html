<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="https://raw.githubusercontent.com/GVN-Team/UjFaT0xVMVFOQzFGYm1OdlpHVXRjbVZ6ZEc5eVpTMUtjMnBrYUZOb1oyUm5SR2hvWkNOZEkzMGxY-U1Y3ZTExN1hRPT0-/refs/heads/main/All.Link.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/GVN-Team/icons./refs/heads/icons/058ED449-2810-4F2A-929D-781F35B2C9D4.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/GVN-Team/icons./refs/heads/icons/058ED449-2810-4F2A-929D-781F35B2C9D4.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/GVN-Team/icons./refs/heads/icons/058ED449-2810-4F2A-929D-781F35B2C9D4.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVN Like Service</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        }

        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            color: #ffffff;
        }

        /* 控えめかつ洗練された青白発光ログインボタン */
        .discord-btn {
            background: linear-gradient(135deg, #5865F2 0%, #6366F1 100%);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(88, 101, 242, 0.45), 0 0 35px rgba(99, 102, 241, 0.25);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .discord-btn:active, .discord-btn:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 0 24px rgba(88, 101, 242, 0.75), 0 0 45px rgba(147, 197, 253, 0.35);
            filter: brightness(1.08);
        }

        /* Glassmorphism Card Style */
        .glass-panel {
            background: rgba(13, 14, 22, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* テキスト省略 (ellipsis) */
        .ellipsis-text {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* スムーススクロールハイライト */
        .highlight-card {
            animation: cardGlow 2s ease-in-out;
        }

        @keyframes cardGlow {
            0% { border-color: #3B82F6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
            100% { border-color: rgba(255, 255, 255, 0.1); box-shadow: none; }
        }
    </style>
</head>
<body>
    <!-- すべてのレイアウトは app.js が描画します -->
    <script src="app.js"></script>
</body>
</html>
